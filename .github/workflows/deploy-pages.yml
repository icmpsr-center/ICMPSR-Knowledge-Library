name: Deploy Knowledge Library to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "knowledge-library.html"
      - "archive-addon.js"
      - "password-recovery-addon.js"
      - "offline-library-addon.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare exact approved source
        run: |
          test -s knowledge-library.html
          mkdir -p public
          cp knowledge-library.html public/index.html
          cp archive-addon.js public/archive-addon.js
          cp password-recovery-addon.js public/password-recovery-addon.js
          cp offline-library-addon.js public/offline-library-addon.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp sw.js public/sw.js
          cp icon.svg public/icon.svg
          sed -i 's#</head>#<link rel="manifest" href="./manifest.webmanifest"></head>#' public/index.html
          sed -i 's#</body>#<script src="archive-addon.js"></script><script src="password-recovery-addon.js"></script><script src="offline-library-addon.js"></script></body>#' public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
