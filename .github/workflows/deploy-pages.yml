name: Deploy Knowledge Library to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "bundle-parts/**"
      - "archive-addon.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild packaged source
        run: |
          cat bundle-parts/part-*.b64 > /tmp/source-bundle.zip.b64
          base64 --decode /tmp/source-bundle.zip.b64 > /tmp/knowledge-library.zip
          unzip -t /tmp/knowledge-library.zip
          mkdir -p /tmp/knowledge-library public
          unzip -q /tmp/knowledge-library.zip -d /tmp/knowledge-library
          cp /tmp/knowledge-library/knowledge-library.html public/index.html
          cp archive-addon.js public/archive-addon.js
          sed -i 's#</body>#<script src="archive-addon.js"></script></body>#' public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
